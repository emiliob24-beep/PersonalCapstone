<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vehiko</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #F6F3EA;
    color: #12335C;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    box-sizing: border-box;
  }
  .card {
    max-width: 480px;
    text-align: center;
  }
  h1 {
    font-size: 2.4rem;
    margin-bottom: 0.25em;
    color: #0F2E52;
  }
  p.tagline {
    color: #3868A6;
    font-size: 1.1rem;
    margin-top: 0;
  }
  .links {
    margin-top: 2rem;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  a.link-button {
    display: block;
    padding: 14px 20px;
    background: #0F2E52;
    color: #F6F3EA;
    text-decoration: none;
    border-radius: 999px;
    font-weight: 600;
    transition: opacity 0.15s ease;
  }
  a.link-button:hover { opacity: 0.85; }
  footer {
    margin-top: 3rem;
    font-size: 0.85rem;
    color: #7A88A0;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Vehiko</h1>
    <p class="tagline">Your vehicle's maintenance, service history, and paperwork — all in one place.</p>
    <div class="links">
      <a class="link-button" href="privacy.html">Privacy Policy</a>
      <a class="link-button" href="support.html">Support</a>
    </div>
    <footer>&copy; 2026 Vehiko</footer>
  </div>
</body>
</html>
